name: Assistant checks
on:
  push:
    paths-ignore:
      - README.md
      - README.en.md
  pull_request:
    paths-ignore:
      - README.md
      - README.en.md
  workflow_call:
    inputs:
      pages_release:
        description: Run the full checks as the Pages publication gate
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: >-
      inputs.pages_release ||
      github.event_name != 'push' ||
      github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: node tests/integration/vite-assets.mjs
      - run: node tests/integration/compilation-cache.mjs
      - run: npm run test
      - run: npm run test:integration
      - run: npm run test:pages
      - run: node tests/integration/storybook-storefront.mjs
      - run: node tests/integration/storybook-background.mjs
      - run: node tests/integration/graphics-preflight.mjs
      - run: node tests/integration/runtime.mjs --graphics-failure
      - run: node tests/integration/runtime.mjs --page-push
      - run: node tests/integration/runtime.mjs --page-push --compact
      - run: node tests/integration/runtime.mjs --quiet
      - run: node tests/integration/runtime.mjs --quiet --compact
      - run: node tests/integration/runtime.mjs --startup
      - run: node tests/integration/runtime.mjs --startup --hidden
      - run: node tests/integration/runtime.mjs --startup --early
      - run: node tests/integration/runtime.mjs --startup --early --hidden
      - run: node tests/integration/runtime.mjs --isolation
      - run: node tests/integration/runtime.mjs --isolation --mobile
      - run: node tests/integration/runtime.mjs --mobile
      - run: node tests/integration/runtime.mjs --reduced
      - run: node tests/integration/runtime.mjs --reduced --mobile
      - run: node tests/integration/runtime.mjs --arrival
      - run: node tests/integration/runtime.mjs --arrival --mobile
      - run: node tests/integration/runtime.mjs --canopy
      - run: node tests/integration/runtime.mjs --canopy --mobile
      - run: node tests/integration/runtime.mjs --speech
      - run: node tests/integration/runtime.mjs --speech --mobile
      - run: node tests/integration/runtime.mjs --transitions
      - run: node tests/integration/runtime.mjs --transitions --mobile
      - run: node tests/integration/runtime.mjs --autonomous
      - run: node tests/integration/runtime.mjs --autonomous --mobile
      - run: node tests/integration/runtime.mjs --autonomous --reduced
      - run: node tests/integration/runtime.mjs --autonomous --off
      - run: node tests/integration/runtime.mjs --checkout
      - run: node tests/integration/runtime.mjs --checkout --mobile
      - run: node tests/integration/runtime.mjs --cart-companion
      - run: node tests/integration/runtime.mjs --cart-companion --mobile
      - run: node tests/integration/runtime.mjs --cart-route
      - run: node tests/integration/runtime.mjs --cart-route --mobile
      - run: node tests/integration/runtime.mjs --skills-companion
      - run: node tests/integration/runtime.mjs --skills-companion --mobile
      - run: node tests/integration/runtime.mjs --calm
      - run: node tests/integration/runtime.mjs --calm --mobile
      - run: node tests/integration/render-mutations.mjs --expect-stable
      - run: npm run build
      - run: npm run check:size
      - run: npm run check:exports
      - run: node tests/integration/distribution-assets.mjs
      - run: node tests/integration/github-pages.mjs
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
